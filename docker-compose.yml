services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-workbench-backend:latest
    container_name: ai-workbench-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/workbench.db
    # Read-only mount of the host .env so config.py keeps its current behavior
    # (single source of truth for vendor keys, never copied into the image).
    volumes:
      - ./backend/.env:/app/.env:ro
      - backend-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ai-workbench-frontend:latest
    container_name: ai-workbench-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data: