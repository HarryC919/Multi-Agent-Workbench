[project]
name = "ai-chat-workbench"
version = "0.1.0"
description = "Intelligent chat workbench backend (FastAPI)"
requires-python = ">=3.11"
# `uvicorn[standard]` pulls watchfiles/uvloop/httptools which fail to build
# or are unavailable on some Windows Python versions. Instead, pin uvicorn
# without the [standard] extra and gate the watcher/loop packages behind
# platform markers so Windows gets a pure-asyncio loop (no watcher binary),
# while unix keeps the fast path and `--reload` still works.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
    "watchfiles>=0.21.0; platform_system != 'Windows'",
    "httptools>=0.6.4; platform_system != 'Windows'",
    "uvloop>=0.21.0; platform_system != 'Windows'",
    # AgentService phase 2a — LangGraph runtime + LangChain core. We do not
    # pull `langchain-openai` / `langchain-anthropic`: our AdapterChatModel
    # bridges to the existing BaseAdapter so ModelConfig/vendor keys remain
    # the single source of truth.
    "langchain-core>=0.3,<0.4",
    "langgraph>=0.2,<0.3",
    # AgentService phase 2b-i — RAG + knowledge base. MarkdownHeaderText/Recursive
    # splitters live in langchain-text-splitters (NOT langchain-core). chromadb is
    # the on-disk vector store; langchain-chroma kept for future wrapper use.
    # sentence-transformers pulls torch (~2GB) — lazy-imported in EmbeddingService
    # so dev/tests run without it via FakeEmbedder no-op fallback.
    "langchain-text-splitters>=0.3,<0.4",
    "chromadb>=0.5",
    "langchain-chroma>=0.1",
    "sentence-transformers>=2.7",
    # Phase 3 — web search skill (DuckDuckGo) + markdown skill frontmatter parsing.
    "duckduckgo-search>=8.0,<9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
# AgentService 2b-i: real-model RAG smoke tests need torch + bge-small-zh
# installed locally; CI skips them via `-m "not slow"`.
markers = [
    "slow: real-model RAG smoke tests (CI-skipped, run locally with `pytest -m slow`)",
]